name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reference-design-maker-api-ci ./backend
      - run: docker build -t reference-design-maker-web-ci ./frontend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check_public_artifacts.mjs
      - run: npm test
        working-directory: browser-extension

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m ruff check app tests alembic
        working-directory: backend
      - run: python scripts/package_collector.py --check
      - run: python -m pytest -m "not integration"
        working-directory: backend

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reference_design_maker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference_design_maker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reference_design_maker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: python -m pytest -m integration
        working-directory: backend
