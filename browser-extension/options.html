<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레퍼런스 메이커 연결</title><link rel="stylesheet" href="options.css"></head>
<body><main><p class="eyebrow">REFERENCE MAKER</p><h1>앱 연결 설정</h1>
<p>링크를 보낼 레퍼런스 메이커 주소를 지정하세요. 현재 페이지의 URL·제목만 전달하며 저장은 앱에서 확인한 뒤 진행합니다.</p>
<form id="settings"><label for="origin">앱 주소</label><input id="origin" type="url" required placeholder="http://127.0.0.1:5174"><button>설정 저장</button></form>
<p id="status" role="status"></p><small>외부 앱은 HTTPS 주소를 사용하세요. 로컬 앱은 실행 중이어야 합니다.</small></main><script type="module" src="options.js"></script></body></html>
